  - question: It is also provided as part of the event accommodation?
    answerHtml: |
      <p>Accommodation is not part of the event. For accommodation, it is possible to use e.g. university dormitories Velky Diel. If you are interested -> please contact us.</p>
  - question: Is the event open to the general public?
    answerHtml: |
      <p>The parts accessible to the public are on Friday approx. from 5PM., when registration, introduction to the event format, presentation of ideas and team formation take place. Also, the final presentations and evaluation of the jury are accessible to the general public on Sunday from 3PM. Due to the limited capacity for teams and the capacity of mentors, participation in the entire event is only available to registered participants who want to actively participate in the event. Registration will be suspended in case of capacity strain.</p>
  - question: What is included in the ticket price?
    answerHtml: |
      <p>The ticket price includes:</p>
      <ul>
        <li>Space and place to work for the whole weekend</li>
        <li>Food for the whole weekend (2x dinner, 2x breakfast, 2x lunch)</li>
        <li>Professional mentoring</li>
        <li>T-shirt</li>
        <li>Office supplies</li>
        <li>Coffee, tea and energy drinks</li>
        <li>Good mood (Capacity is limited. Please also try to bring your own good mood. Otherwise we'll have to tell you jokes and that's exhausting.)</li>
        <li>Merch from our Partners</li>
      </ul>
  - question: What are the prizes for the winners?
    answerHtml: |
      <p>More or less useful advertising items, merch from our partners, after event mentoring, tickets for next events, software licences and subscription plans... But ask yourself! Are you really going to the SWZA for some ordinary stuff you can buy on the internet? Nah... You're comming for the better stuff. Contacts, good time, new friendships, professional mentoring, feedback from judges... See Ya in October!</p>
