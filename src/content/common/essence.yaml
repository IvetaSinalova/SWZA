label: The Essence of techstars
text: An (intense) 54-hour hackathon where you get the space to bring your idea to life. You don't have to be technical. If you don't have an idea, that's okay, you can be part of a team with an idea you decide to support. You can help as a programmer, UX designer, marketer, business specialist, idea maker, specialist in law, domain expert or expert in a particular branch of industry.
textHtml: >-
  An (intense) <strong>54-hour hackathon</strong> where you get the space to
  <strong>bring your idea to life.</strong> The idea doesn't have to be technical.
  If you don't have an idea, that's okay, you can be part of a team with an idea
  you decide to support. You can help as a programmer, UX designer, marketer,
  business specialist, idea maker, specialist in law, domain expert or expert in
  a particular branch of industry.
note: There is a lot of work when you are trying to turn a vision into reality, but the experience and enthusiasm of each team member is useful. Come, form your team and pitch a business idea or join other startup enthusiasts.
