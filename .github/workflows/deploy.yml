name: Build and deploy Astro
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Deploy via FTPS
        timeout-minutes: 5
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<EOF
          debug 5
          set dns:order "inet"
          set net:timeout 30
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-auth TLS
          set ftp:passive-mode true
          set ssl:verify-certificate false
          set ssl:priority-str "NORMAL:%RENEGOTIATION"
          set xfer:log true
          mirror -R --verbose=3 --parallel=2 ./dist/ "${{ secrets.FTP_SERVER_DIR }}"
          bye
          EOF