name: Build and deploy Astro
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy via FTPS
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          $serverDir = $env:FTP_SERVER_DIR.TrimEnd("/")
          $remoteDirUrl = "ftp://$($env:FTP_SERVER)/$serverDir/"
          $remoteIndexUrl = "ftp://$($env:FTP_SERVER)/$serverDir/index.html"

          curl.exe --version

          Write-Host "Checking target directory"
          curl.exe --verbose --fail --show-error --ssl-reqd --insecure `
            --user "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)" `
            "$remoteDirUrl"

          Write-Host "Uploading index.html"
          curl.exe --verbose --fail --show-error --ssl-reqd --insecure --ftp-create-dirs `
            --user "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)" `
            --upload-file "dist/index.html" `
            "$remoteIndexUrl"
